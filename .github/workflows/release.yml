name: Release

# Builds the api and backup images for linux/arm64 (Raspberry Pi 5) and
# linux/amd64 (local use) and pushes them to GHCR:
#   ghcr.io/<owner>/english-learn-{api,backup}
# Tags: sha-<short sha> always; latest on main; <version> and <major>.<minor>
# on v* tags. Pull requests build amd64 only, without pushing, as a smoke test.
# Both images are built on every run, so every sha-<7> tag exists for both
# (deploy/compose.yml runs them with the same IMAGE_TAG).

on:
  push:
    branches: [main]
    # Path filters do not apply to tag pushes: every v* tag builds.
    tags: ["v*"]
    paths:
      - "services/api/**"
      - "deploy/backup/**"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "services/api/**"
      - "deploy/backup/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: services/api
          - image: backup
            context: deploy/backup
    steps:
      - uses: actions/checkout@v7.0.1

      # Neither image cross-compiles (Python wheels and Alpine packages are
      # installed for the target platform), so arm64 builds run under QEMU.
      # Pull requests build amd64 only and skip it.
      - if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4.4.1

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name (GHCR requires lowercase).
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/english-learn-${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
