name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Validate content
        run: pnpm validate:content
      - name: Generated corpus is up to date
        run: pnpm corpus:check

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and WebKit
        run: pnpm --filter @english-learn/mobile exec playwright install --with-deps chromium webkit
      # Production export; fails if test-only hooks (e2e clock override) leak into it.
      - name: Export web build
        run: pnpm --filter @english-learn/mobile export:web
      # Builds its own export with EXPO_PUBLIC_E2E=1 (dist-e2e/) and runs Playwright on it.
      - name: Web e2e tests
        run: pnpm --filter @english-learn/mobile e2e:web

  # Python API (services/api). Integration tests start PostgreSQL 18 with testcontainers,
  # using the runner's Docker daemon, exactly as they do locally.
  api:
    runs-on: ubuntu-latest
    # testcontainers can occasionally stall on container startup; fail fast instead of hanging.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag; pin the release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      # Python comes from services/api/.python-version (uv downloads it).
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Test
        run: uv run pytest

  # The committed OpenAPI schema and TypeScript types (packages/api-client) must match the API.
  # Its own job because regenerating needs both uv/Python and Node; the package's typecheck and
  # tests run in `check`.
  api-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API client is up to date
        run: pnpm api-client:check

  # Production deploy to Cloudflare Pages: only from main, only after every check passed.
  # public/_headers ships the COOP/COEP headers expo-sqlite needs on the web.
  deploy-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, web-e2e]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-web-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: pnpm dlx wrangler@4.156.0
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export web build
        run: pnpm --filter @english-learn/mobile export:web
      # Idempotent: the first deploy creates the project, later runs keep it.
      - name: Ensure Pages project exists
        run: $WRANGLER pages project create english-learn --production-branch=main || echo "Pages project already exists"
      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          $WRANGLER pages deploy apps/mobile/dist --project-name=english-learn --branch=main --commit-dirty=true | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1)" >> "$GITHUB_OUTPUT"
