<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Installable web app (PWA): manifest, theme colors and iOS home screen support. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F5F7FF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1A33" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="English" />
    <!--
      Applies the learner's theme before the first paint, so a chosen scheme never flashes the
      other one: the preference the app caches in localStorage ("english-learn.theme", see
      src/shared/ui/theme-preference.ts), or the system's. The app keeps `data-theme` updated.
    -->
    <script id="theme-boot">
      (function () {
        var preference = null;
        try {
          preference = window.localStorage.getItem("english-learn.theme");
        } catch (error) {}
        var scheme =
          preference === "light" || preference === "dark"
            ? preference
            : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", scheme);
        if (scheme === preference) {
          var paper = scheme === "dark" ? "#0F1A33" : "#F5F7FF";
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.setAttribute("content", paper);
          });
        }
      })();
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* Paper color before the app paints (standalone launch, slow devices): the boot script's
         data-theme, or the system scheme when it could not run. */
      html {
        background-color: #f5f7ff;
        color-scheme: light;
      }
      html[data-theme="dark"] {
        background-color: #0f1a33;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme]) {
          background-color: #0f1a33;
          color-scheme: dark;
        }
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
